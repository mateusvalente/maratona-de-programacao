<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">Equipe de três pessoas em uma competição</title>
  <desc id="desc">Três integrantes dividem leitura, raciocínio e implementação em um único computador.</desc>
  <rect width="900" height="470" fill="#10181c"/>
  <g stroke="#2b3b43" stroke-width="1"><path d="M0 94H900M0 188H900M0 282H900M0 376H900"/><path d="M150 0V470M300 0V470M450 0V470M600 0V470M750 0V470"/></g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(155 126)"><circle r="38" fill="#182a33" stroke="#6bbcff" stroke-width="3"/><text y="7" fill="#f4f7f8" font-size="22" font-weight="800">1</text><rect x="-80" y="65" width="160" height="68" rx="7" fill="#151c20" stroke="#34434b"/><text y="93" fill="#6bbcff" font-size="16" font-weight="700">lê A, B, C</text><text y="116" fill="#aab7be" font-size="14">anota ideias</text></g>
    <g transform="translate(450 126)"><circle r="38" fill="#2b2515" stroke="#ffd166" stroke-width="3"/><text y="7" fill="#f4f7f8" font-size="22" font-weight="800">2</text><rect x="-80" y="65" width="160" height="68" rx="7" fill="#151c20" stroke="#34434b"/><text y="93" fill="#ffd166" font-size="16" font-weight="700">lê D, E, F</text><text y="116" fill="#aab7be" font-size="14">classifica</text></g>
    <g transform="translate(745 126)"><circle r="38" fill="#153426" stroke="#61e3a5" stroke-width="3"/><text y="7" fill="#f4f7f8" font-size="22" font-weight="800">3</text><rect x="-80" y="65" width="160" height="68" rx="7" fill="#151c20" stroke="#34434b"/><text y="93" fill="#61e3a5" font-size="16" font-weight="700">implementa</text><text y="116" fill="#aab7be" font-size="14">testa e envia</text></g>
    <path d="M234 332H666" stroke="#61e3a5" stroke-width="4" stroke-linecap="round"/>
    <rect x="325" y="292" width="250" height="112" rx="8" fill="#182329" stroke="#61e3a5" stroke-width="3"/>
    <rect x="352" y="315" width="196" height="62" rx="4" fill="#0a0f12"/>
    <text x="450" y="341" fill="#aab7be" font-size="15">um computador</text><text x="450" y="365" fill="#61e3a5" font-size="18" font-weight="800">código compartilhado</text>
  </g>
</svg>
