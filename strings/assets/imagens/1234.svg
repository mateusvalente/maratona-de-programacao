<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Estado da sentenca dancante</title>
  <desc id="desc">Uma chave alterna entre maiuscula e minuscula apenas quando encontra uma letra.</desc>
  <rect width="800" height="420" fill="#10161a"/>
  <text x="48" y="58" fill="#f5f7f8" font-family="Arial, sans-serif" font-size="27" font-weight="700">O estado troca somente ao ler uma letra</text>
  <g font-family="Consolas, monospace" text-anchor="middle">
    <g transform="translate(48 125)">
      <g stroke="#41515c"><rect x="0" width="78" height="74" rx="6" fill="#192126"/><rect x="88" width="78" height="74" rx="6" fill="#192126"/><rect x="176" width="78" height="74" rx="6" fill="#20262c"/><rect x="264" width="78" height="74" rx="6" fill="#192126"/><rect x="352" width="78" height="74" rx="6" fill="#192126"/><rect x="440" width="78" height="74" rx="6" fill="#192126"/><rect x="528" width="78" height="74" rx="6" fill="#192126"/></g>
      <g font-size="30"><text x="39" y="47" fill="#5ee0a0">O</text><text x="127" y="47" fill="#68b9ff">l</text><text x="215" y="47" fill="#aeb8c1">_</text><text x="303" y="47" fill="#5ee0a0">M</text><text x="391" y="47" fill="#68b9ff">u</text><text x="479" y="47" fill="#5ee0a0">N</text><text x="567" y="47" fill="#68b9ff">d</text></g>
      <g font-family="Arial, sans-serif" font-size="13"><text x="39" y="99" fill="#5ee0a0">MAIUSC.</text><text x="127" y="99" fill="#68b9ff">minusc.</text><text x="215" y="99" fill="#ffd166">mantem</text><text x="303" y="99" fill="#5ee0a0">MAIUSC.</text><text x="391" y="99" fill="#68b9ff">minusc.</text><text x="479" y="99" fill="#5ee0a0">MAIUSC.</text><text x="567" y="99" fill="#68b9ff">minusc.</text></g>
    </g>
    <g transform="translate(110 286)" font-family="Arial, sans-serif">
      <rect width="210" height="70" rx="7" fill="#15251e" stroke="#456a5a"/>
      <text x="105" y="29" fill="#5ee0a0" font-size="15">proxima letra</text><text x="105" y="53" fill="#f5f7f8" font-size="19">MAIUSCULA</text>
      <path d="M332 35h48m0 0-12-9m12 9-12 9" stroke="#ffd166" stroke-width="4" fill="none"/>
      <rect x="396" width="210" height="70" rx="7" fill="#162432" stroke="#41647e"/>
      <text x="501" y="29" fill="#68b9ff" font-size="15">depois da letra</text><text x="501" y="53" fill="#f5f7f8" font-size="19">minuscula</text>
    </g>
  </g>
</svg>
