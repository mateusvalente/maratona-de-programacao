<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Matriz da maior substring comum</title>
  <desc id="desc">Correspondencias consecutivas formam uma diagonal crescente na tabela dinamica.</desc>
  <rect width="800" height="420" fill="#10161a"/>
  <text x="48" y="52" fill="#f5f7f8" font-family="Arial, sans-serif" font-size="27" font-weight="700">Correspondencias consecutivas formam uma diagonal</text>
  <g transform="translate(84 86)" font-family="Consolas, monospace" font-size="18" text-anchor="middle">
    <g fill="#aeb8c1"><text x="108" y="23">z</text><text x="156" y="23">c</text><text x="204" y="23">d</text><text x="252" y="23">e</text><text x="300" y="23">m</text><text x="348" y="23">f</text><text x="23" y="72">a</text><text x="23" y="120">b</text><text x="23" y="168">c</text><text x="23" y="216">d</text><text x="23" y="264">e</text><text x="23" y="312">f</text></g>
    <g fill="#192126" stroke="#364049">
      <path d="M84 36h288v288H84z"/><path d="M84 84h288M84 132h288M84 180h288M84 228h288M84 276h288M132 36v288M180 36v288M228 36v288M276 36v288M324 36v288"/>
    </g>
    <rect x="132" y="132" width="48" height="48" fill="#214c3b"/><rect x="180" y="180" width="48" height="48" fill="#286c50"/><rect x="228" y="228" width="48" height="48" fill="#35a978"/>
    <g fill="#f5f7f8"><text x="156" y="163">1</text><text x="204" y="211">2</text><text x="252" y="259">3</text></g>
  </g>
  <g transform="translate(510 126)" font-family="Arial, sans-serif">
    <text x="0" y="0" fill="#aeb8c1" font-size="16">quando os caracteres batem:</text>
    <rect y="24" width="240" height="70" rx="7" fill="#15251e" stroke="#456a5a"/>
    <text x="18" y="53" fill="#5ee0a0" font-family="Consolas, monospace" font-size="19">dp[i][j] =</text>
    <text x="18" y="79" fill="#f5f7f8" font-family="Consolas, monospace" font-size="19">dp[i-1][j-1] + 1</text>
    <text x="0" y="142" fill="#aeb8c1" font-size="16">a melhor diagonal vale</text>
    <text x="0" y="205" fill="#ffd166" font-family="Consolas, monospace" font-size="64" font-weight="700">3</text>
    <text x="58" y="203" fill="#f5f7f8" font-family="Consolas, monospace" font-size="26">"cde"</text>
  </g>
</svg>
